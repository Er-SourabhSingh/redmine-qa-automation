              - generic [ref=f221e146]: Zwei-Faktor-Authentifizierung
              - combobox "Zwei-Faktor-Authentifizierung" [ref=f221e147]:
                - option "gesperrt"
                - option "optional" [selected]
                - option "erforderlich für Administratoren"
                - option "erforderlich"
              - emphasis [ref=f221e148]:
                - text: Die Einstellung
                - strong [ref=f221e149]: gesperrt
                - text: deaktiviert Zwei-Faktor-Authentifizierung für alle Nutzer und löscht verbundene Apps. Die Einstellung
                - strong [ref=f221e150]: optional
                - text: läßt den Benutzer Zwei-Faktor-Authentifizierung optional verwenden, solange diese nicht durch eine Benutzergruppe erforderlich ist. Die Einstellung
                - strong [ref=f221e151]: erforderlich für Administratoren
                - text: verhält sich wie 'optional', erfordert aber zusätzlich für alle Benutzer mit Administrator-Rechten die Aktivierung der Zwei-Faktor-Authentifizierung beim nächsten Login. Die Einstellung
                - strong [ref=f221e152]: erforderlich
                - text: fordert alle Nutzer bei ihrem nächsten Login dazu auf Zwei-Faktor-Authentifizierung einzurichten.
