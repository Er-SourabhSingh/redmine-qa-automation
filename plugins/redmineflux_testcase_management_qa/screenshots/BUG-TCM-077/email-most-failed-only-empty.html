<div id="mostFailedChart"
     data-mostfailed="{&quot;labels&quot;:[],&quot;values&quot;:[]}"
     data-series-label="Failures"></div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var el = document.getElementById('mostFailedChart');
    if (!el) { return; }
    var payload = JSON.parse(el.dataset.mostfailed || '{"labels":[],"values":[]}');
    if (!payload.labels.length) { return; }
    var options = {
      chart: { type: 'bar', height: 350, animations: { enabled: false }, toolbar: { show: false } },
      series: [{ name: el.dataset.seriesLabel, data: payload.values }],
      plotOptions: { bar: { horizontal: true } },
      colors: ['#b00020'],
      dataLabels: { enabled: false },
      xaxis: { categories: payload.labels }
    };
    new ApexCharts(el, options).render();
  });
</script>
